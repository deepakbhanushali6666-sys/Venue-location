name: Keep backend warm

on:
  schedule:
    # Every 10 minutes - Render's free tier spins down after ~15 min idle.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 60 https://api.venueslocation.com/health
